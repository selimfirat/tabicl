name: TC-SE archived SE wrapper probe

on:
  push:
    branches:
      - tcse-heldout-audit-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TabICL and probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pandas

      - name: Probe archived Iris SE protocol
        run: python experiments/tcse_se_wrapper_probe.py
