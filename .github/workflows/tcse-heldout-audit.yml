name: TC-SE heldout IF audit

on:
  push:
    branches:
      - tcse-heldout-audit-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install frozen numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0'

      - name: Run sealed IF certificate audit
        run: python experiments/tcse_heldout_if_audit.py

      - name: Upload result table
        uses: actions/upload-artifact@v4
        with:
          name: tcse-heldout-if-results
          path: experiments/tcse_heldout_if_results.csv
          if-no-files-found: error
